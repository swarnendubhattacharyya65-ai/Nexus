name: JobWatch daily collection
on:
  schedule:
    - cron: "17 2 * * *"      # every day, 02:17 UTC
  workflow_dispatch: {}        # also lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: analyser }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas
      - run: python -m jobwatch.run
      - name: Save results
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "JobWatch data $(date -u +%F)"
          git pull --rebase origin analyser
          git push origin analyser
